name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npx playwright install --with-deps chrome
      - run: npm run build
      - run: npm test
        env:
          SHAPCN_REQUIRE_ALL: '1' # the browser and TypeScript tests must run in CI, not skip
