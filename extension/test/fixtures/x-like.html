<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>X-like action bar</title>
<style>
body{margin:0;font:15px system-ui;background:#fff;color:#0f1419}
.tweet{padding:16px;border-bottom:1px solid #eee;width:520px}
.bar{display:flex;gap:40px;margin-top:12px}
.act{display:flex;align-items:center;gap:6px;color:#536471;cursor:pointer;padding:6px}
.act svg{width:18.75px;height:18.75px;fill:currentColor;display:inline-block}
.act:hover{color:#1d9bf0}
nav{display:flex;flex-direction:column;width:240px;padding:8px}
nav a{display:flex;gap:16px;align-items:center;padding:10px;color:#0f1419;text-decoration:none;font-size:20px}
nav a svg{width:26.25px;height:26.25px;fill:currentColor}
.sprite-wrap{padding:16px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="s-bell" viewBox="0 0 24 24"><path d="M19.993 9.042C19.48 5.017 16.054 2 11.996 2s-7.49 3.021-7.999 7.051L2.866 18H7.1c.463 2.282 2.481 4 4.9 4s4.435-1.718 4.9-4h4.236l-1.143-8.958zM12 20c-1.306 0-2.417-.835-2.829-2h5.658c-.412 1.165-1.523 2-2.829 2zm-6.866-4l.847-6.698C6.364 6.272 8.941 4 11.996 4s5.627 2.268 6.013 5.295L18.864 16H5.134z"/></symbol></svg>
<nav id="nav">
<a href="#home" id="n-home"><svg viewBox="0 0 24 24" aria-hidden="true"><g><path d="M12 1.696L.622 8.807l1.06 1.696L3 9.679V19.5C3 20.881 4.119 22 5.5 22h13c1.381 0 2.5-1.119 2.5-2.5V9.679l1.318.824 1.06-1.696L12 1.696zM12 16.5c-1.933 0-3.5-1.567-3.5-3.5s1.567-3.5 3.5-3.5 3.5 1.567 3.5 3.5-1.567 3.5-3.5 3.5z"/></g></svg><span>Home</span></a>
<a href="#bell" id="n-bell"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#s-bell"/></svg><span>Notifications</span></a>
</nav>
<div class="tweet">
<div>Hello from a fixture tweet.</div>
<div class="bar" id="bar">
 <div class="act" role="button" tabindex="0" id="reply" data-n="0"><svg viewBox="0 0 24 24" aria-hidden="true"><g><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z"></path></g></svg><span>12</span></div>
 <div class="act" role="button" tabindex="0" id="repost" data-n="0"><svg viewBox="0 0 24 24" aria-hidden="true"><g><path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z"></path></g></svg><span>3</span></div>
 <div class="act" role="button" tabindex="0" id="like" data-n="0"><svg viewBox="0 0 24 24" aria-hidden="true"><g><path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91z"></path></g></svg><span>99</span></div>
 <div class="act" role="button" tabindex="0" id="bookmark" data-n="0"><svg viewBox="0 0 24 24" aria-hidden="true"><g><path d="M4 4.5C4 3.12 5.119 2 6.5 2h11C18.881 2 20 3.12 20 4.5v18.44l-8-5.71-8 5.71V4.5zM6.5 4c-.276 0-.5.22-.5.5v14.56l6-4.29 6 4.29V4.5c0-.28-.224-.5-.5-.5h-11z"></path></g></svg></div>
 <div class="act" role="button" tabindex="0" id="share" data-n="0"><svg viewBox="0 0 24 24" aria-hidden="true"><g><path d="M12 2.59l5.7 5.7-1.41 1.42L13 6.41V16h-2V6.41l-3.3 3.3-1.41-1.42L12 2.59zM21 15l-.02 3.51c0 1.38-1.12 2.49-2.5 2.49H5.5C4.11 21 3 19.88 3 18.5V15h2v3.5c0 .28.22.5.5.5h12.98c.28 0 .5-.22.5-.5L19 15h2z"></path></g></svg></div>
</div>
</div>
<script>
window.clicks={};
for(const el of document.querySelectorAll('[role=button]')) el.addEventListener('click',()=>{window.clicks[el.id]=(window.clicks[el.id]||0)+1;el.dataset.n=window.clicks[el.id];});
for(const a of document.querySelectorAll('nav a')) a.addEventListener('click',e=>{e.preventDefault();window.clicks[a.id]=(window.clicks[a.id]||0)+1;});
</script>
</body></html>
