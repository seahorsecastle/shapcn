<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>use with an unreadable style sheet</title>
<style>
body{margin:20px}
.b{display:inline-grid;place-items:center;width:44px;height:44px;border:1px solid #ccc;margin:6px;cursor:pointer;background:#fff;color:#111}
.b svg{width:24px;height:24px;fill:currentColor;stroke:none}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<path id="pp" d="M4 4h16v16H4z"/>
<path id="pi" style="visibility:visible;fill-opacity:1;stroke-opacity:1" d="M4 4h16v16H4z"/>
</defs></svg>
<button class="b" id="xo-plain"><svg viewBox="0 0 24 24"><use href="#pp"/></svg></button>
<button class="b" id="xo-settled"><svg viewBox="0 0 24 24"><use href="#pi"/></svg></button>
</body></html>
